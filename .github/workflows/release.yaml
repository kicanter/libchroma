name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - wasm32-freestanding

    runs-on: ubuntu-slim
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build lib -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/include/chroma.h dist/ 2>/dev/null || true
          cp zig-out/lib/libchroma.a dist/ 2>/dev/null || true
          cp zig-out/lib/libchroma.so* dist/ 2>/dev/null || true
          cp zig-out/lib/libchroma.*dylib dist/ 2>/dev/null || true
          cp zig-out/lib/chroma.lib dist/ 2>/dev/null || true
          cp zig-out/bin/chroma.dll dist/ 2>/dev/null || true
          cp zig-out/bin/chroma.wasm dist/ 2>/dev/null || true
          tar -czf libchroma-${{ matrix.target }}.tar.gz -C dist .

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: libchroma-${{ matrix.target }}.tar.gz
